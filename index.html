<script>
    // ==============================================
    // API KEY
    // ==============================================
    const UNSPLASH_ACCESS_KEY = 'quAxMVxy1ujEhTBZyoMjJeEjBfrRgJckdDDWc8UCJMI';

    // ==============================================
    // SUGGESTIONS
    // ==============================================
    const SUGGESTIONS = [
        'Nature', 'Mountain', 'Forest', 'Sunset', 'Ocean', 'Beach', 'Waterfall',
        'City', 'Night', 'Street', 'Architecture', 'Building', 'Bridge',
        'Car', 'Motorcycle', 'Bicycle', 'Train', 'Airplane',
        'Animal', 'Cat', 'Dog', 'Bird', 'Horse', 'Lion', 'Tiger', 'Elephant',
        'Flower', 'Rose', 'Tulip', 'Lotus', 'Sunflower',
        'Food', 'Pizza', 'Burger', 'Pasta', 'Sushi', 'Cake', 'Coffee',
        'Technology', 'Computer', 'Phone', 'Robot', 'Space', 'Galaxy',
        'Portrait', 'People', 'Girl', 'Boy', 'Family', 'Couple',
        'Sports', 'Football', 'Cricket', 'Basketball', 'Tennis', 'Swimming',
        'Art', 'Painting', 'Sketch', 'Abstract', 'Pattern',
        'Background', 'Wallpaper', 'Texture', 'Minimal',
        'India', 'Taj Mahal', 'Gateway of India', 'Jaipur', 'Kerala', 'Himalayas'
    ];

    // ==============================================
    // DOM REFS
    // ==============================================
    const resultsGrid = document.getElementById('resultsGrid');
    const skeletonGrid = document.getElementById('skeletonGrid');
    const searchInput = document.getElementById('searchInput');
    const suggestionsDiv = document.getElementById('suggestions');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const fullscreenOverlay = document.getElementById('fullscreenOverlay');
    const fsImage = document.getElementById('fsImage');
    const fsImageWrapper = document.getElementById('fsImageWrapper');
    const fsUser = document.getElementById('fsUser');
    const fsDownloadBtn = document.getElementById('fsDownloadBtn');
    const relatedGrid = document.getElementById('relatedGrid');
    const relatedSection = document.getElementById('relatedSection');
    const scrollIndicator = document.getElementById('scrollIndicator');
    const downloadProgress = document.getElementById('downloadProgress');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const progressFilename = document.getElementById('progressFilename');
    const progressStatus = document.getElementById('progressStatus');
    
    let toastTimeout = null;
    let currentImageData = null;
    let currentKeyword = 'nature';
    let isRelatedLoading = false;
    let relatedLoaded = false;
    let isDownloading = false;

    // ==============================================
    // SUGGESTIONS
    // ==============================================
    searchInput.addEventListener('input', function() {
        const value = this.value.toLowerCase().trim();
        if (value.length === 0) {
            suggestionsDiv.classList.remove('show');
            return;
        }
        const filtered = SUGGESTIONS.filter(s => s.toLowerCase().includes(value)).slice(0, 10);
        if (filtered.length === 0) {
            suggestionsDiv.classList.remove('show');
            return;
        }
        suggestionsDiv.innerHTML = filtered.map(s => 
            `<div class="suggestion-item" onclick="selectSuggestion('${s}')">
                <i class="fas fa-search"></i> ${s}
            </div>`
        ).join('');
        suggestionsDiv.classList.add('show');
    });

    function selectSuggestion(text) {
        searchInput.value = text;
        suggestionsDiv.classList.remove('show');
        searchImages(text);
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-box')) {
            suggestionsDiv.classList.remove('show');
        }
    });

    // ==============================================
    // TOAST
    // ==============================================
    function showToast(message, isError = false) {
        toastMessage.textContent = message;
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        toast.querySelector('i').style.color = isError ? '#ff6b6b' : '#4CAF50';
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ==============================================
    // DOWNLOAD WITH PROGRESS BAR - FAST & OPTIMIZED
    // ==============================================
    async function downloadImageWithProgress(url, filename = 'image.jpg') {
        if (isDownloading) return;
        isDownloading = true;
        fsDownloadBtn.disabled = true;
        fsDownloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Downloading...';
        
        // Show progress bar
        downloadProgress.classList.add('show');
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        progressFilename.textContent = filename;
        progressStatus.textContent = 'Starting download...';

        try {
            // Use fetch with stream for progress tracking
            const response = await fetch(url);
            if (!response.ok) throw new Error('Download failed');
            
            const contentLength = response.headers.get('content-length');
            const total = contentLength ? parseInt(contentLength, 10) : 0;
            const reader = response.body.getReader();
            
            let received = 0;
            const chunks = [];
            
            progressStatus.textContent = 'Downloading...';
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                chunks.push(value);
                received += value.length;
                
                if (total > 0) {
                    const percent = Math.round((received / total) * 100);
                    progressFill.style.width = percent + '%';
                    progressPercent.textContent = percent + '%';
                    progressStatus.textContent = `Downloading ${Math.round(received / 1024)} KB / ${Math.round(total / 1024)} KB`;
                } else {
                    progressStatus.textContent = `Downloading ${Math.round(received / 1024)} KB...`;
                }
            }
            
            // Combine chunks
            const blob = new Blob(chunks);
            const blobUrl = URL.createObjectURL(blob);
            
            progressStatus.textContent = 'Saving file...';
            progressFill.style.width = '100%';
            progressPercent.textContent = '100%';
            
            // Trigger download
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
            
            // Hide progress after delay
            setTimeout(() => {
                downloadProgress.classList.remove('show');
                showToast('✅ HD image downloaded successfully!');
            }, 1500);
            
        } catch (error) {
            console.error('Download error:', error);
            downloadProgress.classList.remove('show');
            showToast('❌ Download failed. Try right-click > Save Image As', true);
        }
        
        isDownloading = false;
        fsDownloadBtn.disabled = false;
        fsDownloadBtn.innerHTML = '<i class="fas fa-download"></i> Download HD';
    }

    // ==============================================
    // SEARCH - WITH SKELETON LOADER
    // ==============================================
    async function searchImages(query = null) {
        const keyword = query || searchInput.value.trim();
        if (!keyword) {
            showToast('⚠️ Please enter a keyword!', true);
            return;
        }

        currentKeyword = keyword;
        closeFullscreen();
        
        // Show skeleton, hide results
        skeletonGrid.style.display = 'grid';
        resultsGrid.style.display = 'none';
        resultsGrid.innerHTML = '';

        try {
            const url = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(keyword)}&per_page=24&client_id=${UNSPLASH_ACCESS_KEY}`;
            const response = await fetch(url);
            
            if (!response.ok) {
                if (response.status === 401) {
                    showToast('❌ Invalid API Key!', true);
                    skeletonGrid.style.display = 'none';
                    return;
                }
                throw new Error('API error: ' + response.status);
            }
            
            const data = await response.json();

            // Hide skeleton, show results
            skeletonGrid.style.display = 'none';
            resultsGrid.style.display = 'grid';

            if (data.results && data.results.length > 0) {
                displayImages(data.results, resultsGrid);
                showToast(`✅ ${data.results.length} HD images found for "${keyword}"`);
            } else {
                resultsGrid.innerHTML = `<div class="no-results"><i class="fas fa-search"></i>No images found for "<strong>${keyword}</strong>"</div>`;
                showToast('😕 No images found', true);
            }
        } catch (error) {
            console.error('Error:', error);
            skeletonGrid.style.display = 'none';
            resultsGrid.style.display = 'grid';
            resultsGrid.innerHTML = `<div class="no-results"><i class="fas fa-exclamation-triangle"></i>Error loading images. Check your connection.</div>`;
            showToast('❌ Network error', true);
        }
    }

    // ==============================================
    // DISPLAY IMAGES
    // ==============================================
    function displayImages(images, container, isRelated = false) {
        container.innerHTML = '';
        images.forEach((img) => {
            const card = document.createElement('div');
            card.className = 'result-card';
            
            const previewUrl = img.urls?.regular || img.urls?.small;
            const alt = img.alt_description || img.description || 'Image';
            const user = img.user?.name || 'Photographer';
            const width = img.width || '?';
            const height = img.height || '?';
            const sizeText = width !== '?' ? `${width}×${height}` : 'HD';

            // Lazy load images - fast loading
            card.innerHTML = `
                <div class="image-wrapper">
                    <img src="${previewUrl}" alt="${alt}" loading="lazy" decoding="async" />
                    <span class="hd-badge"><i class="fas fa-star"></i> HD</span>
                </div>
                <div class="info">
                    <span class="user"><i class="fas fa-camera"></i> ${user}</span>
                    <span class="size">${sizeText}</span>
                </div>
            `;

            card.addEventListener('click', function(e) {
                e.stopPropagation();
                openFullscreen(img);
            });

            container.appendChild(card);
        });
    }

    // ==============================================
    // FULLSCREEN
    // ==============================================
    function openFullscreen(imageData) {
        currentImageData = imageData;
        const hdUrl = getHDUrl(imageData);
        const previewUrl = imageData.urls?.regular || imageData.urls?.small || imageData.urls?.full;
        const alt = imageData.alt_description || imageData.description || 'Image';
        const user = imageData.user?.name || 'Photographer';

        fsImage.src = previewUrl;
        fsImage.alt = alt;
        fsUser.innerHTML = `<i class="fas fa-camera"></i> ${user}`;
        
        fsDownloadBtn.onclick = function(e) {
            e.stopPropagation();
            const filename = `${alt.replace(/[^a-zA-Z0-9]/g, '_')}.jpg`;
            downloadImageWithProgress(hdUrl, filename);
        };

        fullscreenOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
        
        // Reset
        relatedGrid.innerHTML = '';
        relatedLoaded = false;
        isRelatedLoading = false;
        scrollIndicator.style.display = 'block';
        
        fullscreenOverlay.scrollTop = 0;
        fsImageWrapper.style.transform = '';
        fsImageWrapper.style.opacity = '';
    }

    function closeFullscreen() {
        fullscreenOverlay.classList.remove('show');
        document.body.style.overflow = 'auto';
        relatedGrid.innerHTML = '';
        relatedLoaded = false;
        isRelatedLoading = false;
        // Hide download progress if visible
        downloadProgress.classList.remove('show');
        isDownloading = false;
        if (fsDownloadBtn) {
            fsDownloadBtn.disabled = false;
            fsDownloadBtn.innerHTML = '<i class="fas fa-download"></i> Download HD';
        }
    }

    function getHDUrl(imageData) {
        return imageData.urls?.raw || imageData.urls?.full || imageData.urls?.regular || imageData.urls?.small;
    }

    // ==============================================
    // SCROLL HANDLER
    // ==============================================
    function handleScroll() {
        const overlay = fullscreenOverlay;
        const scrollTop = overlay.scrollTop;
        
        const maxScroll = 200;
        const scrollAmount = Math.min(scrollTop, maxScroll);
        const scaleAmount = Math.max(0.95, 1 - (scrollAmount / maxScroll) * 0.05);
        
        if (scrollTop < maxScroll) {
            fsImageWrapper.style.transform = `translateY(${-scrollAmount * 0.3}px) scale(${scaleAmount})`;
            fsImageWrapper.style.opacity = 1 - (scrollAmount / maxScroll) * 0.05;
        }
        
        const scrollHeight = overlay.scrollHeight;
        const clientHeight = overlay.clientHeight;
        const maxScrollTop = scrollHeight - clientHeight;
        
        if (maxScrollTop > 0) {
            const scrollPercent = (scrollTop / maxScrollTop) * 100;
            if (scrollPercent > 15 && !relatedLoaded && !isRelatedLoading && currentImageData) {
                loadRelatedImages();
            }
        }
    }

    // ==============================================
    // LOAD RELATED IMAGES
    // ==============================================
    async function loadRelatedImages() {
        if (isRelatedLoading || relatedLoaded) return;
        if (!currentImageData) return;
        
        isRelatedLoading = true;
        scrollIndicator.style.display = 'none';
        
        relatedGrid.innerHTML = `<div class="related-loading"><i class="fas fa-spinner"></i> Loading related images...</div>`;

        let searchTerm = currentKeyword;
        if (currentImageData.alt_description) {
            const words = currentImageData.alt_description.split(' ');
            if (words.length > 0 && words[0].length > 2) {
                searchTerm = words[0];
            }
        }

        try {
            const url = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(searchTerm)}&per_page=12&client_id=${UNSPLASH_ACCESS_KEY}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('API error');
            const data = await response.json();

            if (data.results && data.results.length > 0) {
                const filtered = data.results.filter(img => img.id !== currentImageData.id);
                if (filtered.length > 0) {
                    relatedGrid.innerHTML = '';
                    displayImages(filtered, relatedGrid, true);
                    relatedLoaded = true;
                } else {
                    relatedGrid.innerHTML = `<div class="no-results" style="padding:20px; font-size:0.9rem;">No related images found</div>`;
                }
            } else {
                relatedGrid.innerHTML = `<div class="no-results" style="padding:20px; font-size:0.9rem;">No related images found</div>`;
            }
        } catch (error) {
            console.error('Related images error:', error);
            relatedGrid.innerHTML = `<div class="no-results" style="padding:20px; font-size:0.9rem;">Could not load related images</div>`;
        }

        isRelatedLoading = false;
    }

    // ==============================================
    // EVENT LISTENERS
    // ==============================================
    fullscreenOverlay.addEventListener('scroll', handleScroll);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeFullscreen();
        }
    });

    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            suggestionsDiv.classList.remove('show');
            searchImages();
        }
    });

    // ==============================================
    // STARTUP
    // ==============================================
    window.onload = function() {
        // Preload first search
        setTimeout(() => searchImages('nature'), 100);
    };
</script>
</body>
</html>
